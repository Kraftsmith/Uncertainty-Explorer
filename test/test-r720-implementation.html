<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R7.20 Full Implementation Test</title>
    <link rel="stylesheet" href="common-styles.css">
    <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
        .test-controls { margin-bottom: 20px; }
        .test-controls button { margin: 5px; padding: 8px 15px; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        .info { color: blue; }
        #test-results { background: #f9f9f9; padding: 15px; border-radius: 4px; max-height: 300px; overflow-y: auto; }
        #practices-table { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🧪 R7.20 Full Implementation Test</h1>
    <p>This test validates that R7.20 (complexity exclusion) is correctly implemented in the actual delivery practices table.</p>
    
    <div class="test-section">
        <h2>Test Controls</h2>
        <div class="test-controls">
            <button onclick="testScenario('Complex', 'Complex')">Test Complex + Complex</button>
            <button onclick="testScenario('Complex', 'Complicated')">Test Complex + Complicated</button>
            <button onclick="testScenario('Complicated', 'Complex')">Test Complicated + Complex</button>
            <button onclick="testScenario('Simple', 'Complicated')">Test Simple + Complicated</button>
            <button onclick="testScenario('Complicated', 'Complicated')">Test Complicated + Complicated</button>
            <button onclick="testScenario('Simple', 'Clear')">Test Simple + Clear</button>
            <button onclick="runAllTests()">🚀 Run All Tests</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>
    </div>

    <div class="test-section">
        <h2>Test Results</h2>
        <div id="test-results"></div>
    </div>

    <div class="test-section">
        <h2>Delivery Practices Table</h2>
        <div id="practices-table"></div>
    </div>

    <!-- Load dependencies -->
    <script src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>
    <script src="Data/delivery-practices.js"></script>
    <script src="JavaScript/delivery-practices-table.js"></script>

    <script>
        let practicesTable;
        const resultsDiv = document.getElementById('test-results');
        let testOutput = '';

        function log(message, type = 'info') {
            console.log(message);
            const className = type === 'pass' ? 'pass' : type === 'fail' ? 'fail' : 'info';
            testOutput += `<div class="${className}">${message}</div>`;
            updateResults();
        }

        function updateResults() {
            resultsDiv.innerHTML = testOutput;
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        function clearResults() {
            testOutput = '';
            updateResults();
        }

        // Initialize the table
        function initializeTable() {
            if (practicesTable) {
                practicesTable.table.destroy();
            }
            practicesTable = new DeliveryPracticesTable('practices-table');
            practicesTable.init();
        }

        // Set test data in localStorage and trigger filtering
        async function testScenario(staceyResult, cynefinResult) {
            log(`\n🔍 Testing Scenario: ${staceyResult} + ${cynefinResult}`, 'info');
            
            const staceyData = { area: staceyResult, product: {}, technical: {}, team: {}, timestamp: new Date().toISOString() };
            localStorage.setItem('staceyMatrixResults', JSON.stringify(staceyData));

            const cynefinData = { domain: cynefinResult, allQuestionScores: [], averageDecisionScore: 0, averageCauseEffectScore: 0, timestamp: new Date().toISOString() };
            localStorage.setItem('cynefinFrameworkAssessmentResults_v3', JSON.stringify(cynefinData));
            
            log(`📝 Set localStorage for Stacey="${staceyResult}", Cynefin="${cynefinResult}"`);
            
            initializeTable();
            
            // Wait for the table to be fully ready before applying filters
            await new Promise(resolve => {
                const interval = setInterval(() => {
                    if (practicesTable && practicesTable.tableReady) {
                        clearInterval(interval);
                        resolve();
                    }
                }, 100);
            });

            await practicesTable.applyAssessmentFilters();
            
            // Validation is now called directly after await
            validateR720Implementation(staceyResult, cynefinResult);
        }

        function validateR720Implementation(staceyResult, cynefinResult) {
            if (!practicesTable || !practicesTable.table) {
                log('❌ Table not ready for validation', 'fail');
                return;
            }

            const filteredData = practicesTable.table.getData();
            const hasComplexity = (staceyResult === "Complex" || cynefinResult === "Complex");
            
            log(`🔍 Complexity detected: ${hasComplexity}`);
            log(`📊 Filtered practices count: ${filteredData.length}/${deliveryPractices.length}`);
            
            // R7.20 Validation - Updated to check both primaryArea and secondaryArea
            if (hasComplexity) {
                const predictiveViolations = filteredData.filter(p => 
                    p.primaryArea === "Predictive" || p.secondaryArea === "Predictive"
                );
                if (predictiveViolations.length > 0) {
                    log(`❌ R7.20 VIOLATION: Found ${predictiveViolations.length} practices with "Predictive" in either primaryArea or secondaryArea`, 'fail');
                    predictiveViolations.forEach(p => {
                        log(`  - "${p.name}" (${p.primaryArea}/${p.secondaryArea || 'none'})`, 'fail');
                    });
                    return false;
                } else {
                    log(`✅ R7.20 COMPLIANCE: No practices with "Predictive" in either primaryArea or secondaryArea when complexity detected`, 'pass');
                }
            } else {
                const includedPredictive = filteredData.filter(p => 
                    p.primaryArea === "Predictive" || p.secondaryArea === "Predictive"
                );
                log(`ℹ️ R7.20 not applicable (no complexity). Predictive practices included: ${includedPredictive.length}`);
            }

            // Show sample practices
            log(`📋 Sample practices included:`);
            filteredData.slice(0, 5).forEach(p => {
                log(`  - "${p.name}" (${p.primaryArea}/${p.secondaryArea || 'none'})`);
            });
            if (filteredData.length > 5) {
                log(`  ... and ${filteredData.length - 5} more`);
            }
            
            return true;
        }

        async function runAllTests() {
            clearResults();
            log('🚀 Running All R7.20 Implementation Tests', 'info');
            log('=====================================');
            
            const scenarios = [
                ['Complex', 'Complex'],
                ['Complex', 'Complicated'], 
                ['Complicated', 'Complex'],
                ['Simple', 'Complicated'],
                ['Complicated', 'Complicated'],
                ['Simple', 'Clear']
            ];
            
            for (const scenario of scenarios) {
                const [stacey, cynefin] = scenario;
                await testScenario(stacey, cynefin);
                // Optional delay between tests for visibility
                await new Promise(resolve => setTimeout(resolve, 200)); 
            }
            
            log('\n🏁 All tests completed!', 'pass');
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            log('🧪 R7.20 Full Implementation Test Initialized', 'info');
            log('Click a test button to validate R7.20 implementation', 'info');
            initializeTable();
        });
    </script>
</body>
</html>
