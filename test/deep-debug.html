<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Debug: Table Initialization</title>
    
    <!-- Add Tabulator -->
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .debug-section { background: white; margin: 10px 0; padding: 15px; border-radius: 5px; }
        .debug-log { background: #000; color: #0f0; padding: 10px; font-family: monospace; height: 300px; overflow-y: auto; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .warning { color: #ffc107; }
        .info { color: #17a2b8; }
    </style>
</head>
<body>
    <h1>🔬 Deep Debug: Table Initialization</h1>
    
    <div class="debug-section">
        <h3>Debug Log</h3>
        <div id="debug-log" class="debug-log"></div>
    </div>
    
    <div class="debug-section">
        <h3>Table Container</h3>
        <div id="deep-debug-container"></div>
    </div>
    
    <div class="debug-section">
        <h3>Controls</h3>
        <button onclick="runDeepDebug()">🔍 Run Deep Debug</button>
        <button onclick="clearLog()">🧹 Clear Log</button>
        <button onclick="forceTableInit()">🚀 Force Table Init</button>
    </div>

    <!-- Load dependencies with explicit timing -->
    <script>
        let debugLog = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${message}`;
            debugLog.push({timestamp, message, type});
            
            const logEl = document.getElementById('debug-log');
            const div = document.createElement('div');
            div.className = type;
            div.textContent = entry;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
            
            console.log(`%c${entry}`, `color: ${getColor(type)}`);
        }
        
        function getColor(type) {
            switch(type) {
                case 'success': return '#28a745';
                case 'error': return '#dc3545';
                case 'warning': return '#ffc107';
                case 'info': return '#17a2b8';
                default: return '#000';
            }
        }
        
        function clearLog() {
            document.getElementById('debug-log').innerHTML = '';
            debugLog = [];
        }
        
        log('🚀 Starting deep debug session...', 'info');
    </script>
    
    <script src="Data/delivery-practices.js" onload="log('✅ delivery-practices.js loaded', 'success')" onerror="log('❌ Failed to load delivery-practices.js', 'error')"></script>
    <script src="JavaScript/delivery-practices-table.js" onload="log('✅ delivery-practices-table.js loaded', 'success')" onerror="log('❌ Failed to load delivery-practices-table.js', 'error')"></script>
    
    <script>
        // Wait a moment for scripts to load
        setTimeout(() => {
            log('🔍 Checking loaded dependencies...', 'info');
            
            // Check each dependency
            log(`deliveryPractices: ${typeof deliveryPractices !== 'undefined' ? '✅ Available' : '❌ Missing'}`, 
                typeof deliveryPractices !== 'undefined' ? 'success' : 'error');
            
            if (typeof deliveryPractices !== 'undefined') {
                log(`  - Array length: ${deliveryPractices.length}`, 'info');
                log(`  - Sample item: ${deliveryPractices[0]?.name || 'N/A'}`, 'info');
            }
            
            log(`DeliveryPracticesTable: ${typeof DeliveryPracticesTable !== 'undefined' ? '✅ Available' : '❌ Missing'}`, 
                typeof DeliveryPracticesTable !== 'undefined' ? 'success' : 'error');
            
            log(`Tabulator: ${typeof Tabulator !== 'undefined' ? '✅ Available' : '❌ Missing'}`, 
                typeof Tabulator !== 'undefined' ? 'success' : 'error');
            
            if (typeof Tabulator !== 'undefined') {
                log(`  - Tabulator version: ${Tabulator.version || 'unknown'}`, 'info');
            }
            
            // Auto-run debug
            runDeepDebug();
            
        }, 1000);
        
        function runDeepDebug() {
            log('🔬 Starting deep debug analysis...', 'warning');
            
            if (typeof DeliveryPracticesTable === 'undefined') {
                log('❌ Cannot proceed - DeliveryPracticesTable not loaded', 'error');
                return;
            }
            
            if (typeof deliveryPractices === 'undefined') {
                log('❌ Cannot proceed - deliveryPractices not loaded', 'error');
                return;
            }
            
            if (typeof Tabulator === 'undefined') {
                log('❌ Cannot proceed - Tabulator not loaded', 'error');
                return;
            }
            
            // Clear container
            const container = document.getElementById('deep-debug-container');
            container.innerHTML = '<div id="debug-table-container"></div>';
            
            log('🏗️ Creating table instance...', 'info');
            
            try {
                // Create custom table instance with enhanced debugging
                const debugTable = new DeliveryPracticesTable('debug-table-container');
                log('✅ Table instance created successfully', 'success');
                
                // Monitor table properties
                log('🔍 Initial table state:', 'info');
                log(`  - tableReady: ${debugTable.tableReady}`, 'info');
                log(`  - containerId: ${debugTable.containerId}`, 'info');
                
                // Patch table methods to add logging
                const originalInit = debugTable.init.bind(debugTable);
                debugTable.init = function() {
                    log('🔧 init() method called', 'info');
                    return originalInit();
                };
                
                const originalCreateTableContainer = debugTable.createTableContainer.bind(debugTable);
                debugTable.createTableContainer = function() {
                    log('🏗️ createTableContainer() called', 'info');
                    const result = originalCreateTableContainer();
                    log('✅ createTableContainer() completed', 'success');
                    return result;
                };
                
                const originalInitializeTable = debugTable.initializeTable.bind(debugTable);
                debugTable.initializeTable = function() {
                    log('🔧 initializeTable() called', 'info');
                    try {
                        const result = originalInitializeTable();
                        log('✅ initializeTable() completed without error', 'success');
                        return result;
                    } catch (error) {
                        log(`❌ initializeTable() failed: ${error.message}`, 'error');
                        throw error;
                    }
                };
                
                // Monitor tableReady changes
                let lastReady = debugTable.tableReady;
                const monitorReady = setInterval(() => {
                    if (debugTable.tableReady !== lastReady) {
                        log(`🔄 tableReady changed: ${lastReady} → ${debugTable.tableReady}`, 'warning');
                        lastReady = debugTable.tableReady;
                        
                        if (debugTable.tableReady) {
                            log('🎉 Table is now ready!', 'success');
                            clearInterval(monitorReady);
                        }
                    }
                }, 100);
                
                // Set timeout for monitoring
                setTimeout(() => {
                    clearInterval(monitorReady);
                    if (!debugTable.tableReady) {
                        log('⏰ Monitoring timeout - table still not ready', 'error');
                    }
                }, 15000);
                
                // Call init
                log('🚀 Calling init()...', 'warning');
                debugTable.init();
                
                // Store globally for inspection
                window.debugTable = debugTable;
                log('✅ Debug table stored as window.debugTable', 'success');
                
            } catch (error) {
                log(`❌ Error during table creation: ${error.message}`, 'error');
                log(`Stack trace: ${error.stack}`, 'error');
            }
        }
        
        function forceTableInit() {
            log('🔥 Force initializing with minimal debugging...', 'warning');
            
            const container = document.getElementById('deep-debug-container');
            container.innerHTML = '<div id="force-table-container"></div>';
            
            try {
                const forceTable = new DeliveryPracticesTable('force-table-container');
                forceTable.init();
                
                // Check readiness every second
                let checks = 0;
                const checkInterval = setInterval(() => {
                    checks++;
                    log(`Check ${checks}: tableReady = ${forceTable.tableReady}`, 'info');
                    
                    if (forceTable.tableReady) {
                        log('🎉 Force init successful!', 'success');
                        clearInterval(checkInterval);
                        window.forceTable = forceTable;
                    } else if (checks >= 20) {
                        log('❌ Force init failed after 20 checks', 'error');
                        clearInterval(checkInterval);
                    }
                }, 1000);
                
            } catch (error) {
                log(`❌ Force init error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
